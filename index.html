*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1b33;font-family:"Zen Maru Gothic","Kiwi Maru",sans-serif;color:var(--ink)}
canvas{display:block}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:rgba(246,243,238,.94);z-index:10;overflow:auto}

h1{font-family:"Kiwi Maru";font-size:clamp(28px,6vw,60px);margin:0 0 4px;letter-spacing:.04em;text-align:center;color:var(--ink)}

.chars{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:960px}
.screen.menu{padding:0;background:radial-gradient(120% 90% at 20% 0%,#fff6fb 0%,#f3ecff 45%,#e4ecff 100%);overflow:hidden}

#title{justify-content:flex-start;height:100dvh}

.pc:not(.sel) img{filter:saturate(.7) brightness(.9)}
.pc.sel img{transform:scale(1.04)}
.pc .tag{position:absolute;left:10px;right:10px;bottom:10px;background:#fffffff0;border-radius:20px;padding:8px 12px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.pc .tag b{display:block;font-size:clamp(12px,2.3vh,19px);line-height:1.25;color:var(--ink)}

.pc.sel .tag small{display:block}
.pc .ok{position:absolute;top:10px;right:10px;background:#fff;color:var(--c);font-weight:900;border-radius:999px;padding:4px 12px;font-size:14px;opacity:0;transform:scale(.5);transition:.3s cubic-bezier(.3,1.6,.5,1)}
.pc.sel .ok{opacity:1;transform:scale(1)}
.pc .tag .sh{display:none}

.btn.big{font-size:clamp(18px,3.4vh,26px);padding:clamp(8px,1.6vh,14px) clamp(34px,6vw,60px);background:linear-gradient(#9a6cf0,#7a4fd0);animation:breathe 1.6s ease-in-out infinite}

.who{width:clamp(44px,9vh,72px);height:clamp(44px,9vh,72px);border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 0 rgba(75,45,140,.2);flex:none}
.who img{width:100%;height:100%;object-fit:cover}
.backBtn{flex:none;border:none;background:#fff;color:var(--ink);font-family:inherit;font-weight:900;border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 #d9cfee;cursor:pointer;font-size:15px}
.map{position:relative;z-index:1;flex:1;min-height:0;width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:clamp(6px,1.6vh,18px) clamp(8px,1.6vw,18px);padding:clamp(10px,3vh,30px) clamp(12px,3vw,40px);overflow:auto}

.btn.sec{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfc8bc}
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none;z-index:5;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}

#touch{height:100%}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:65%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);left:100px;bottom:-10px;top:auto;display:flex;align-items:center;justify-content:center;transition:opacity .2s}

#actBtn{width:80px;height:80px}
#actBtn.ready{background:rgba(160,80,255,.75);border-color:#fff;animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
#rotateHint{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(45,42,74,.7);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;z-index:6;display:none;pointer-events:none}
@media (orientation:portrait){body.playing.touch #rotateHint{display:block}}
@media(max-height:500px){#banner{top:12%!important;font-size:24px!important}}
#banner{position:fixed;top:30%;left:0;right:0;text-align:center;font-family:"Kiwi Maru";font-size:clamp(26px,6vw,54px);color:#fff;text-shadow:0 4px 0 var(--purple),0 0 20px #0005;z-index:7;pointer-events:none;opacity:0;transition:opacity .4s}
.res{background:#fff;border-radius:24px;padding:20px 30px;box-shadow:0 6px 0 #d8d2c8;text-align:center;font-size:20px;line-height:1.8;margin-bottom:10px}
.res .big{font-size:34px;letter-spacing:6px}
.row{display:flex;flex-wrap:wrap;justify-content:center}
</style>

<body>
<div id="hud"><div><span class="pill" id="hStage">1-1</span><span class="pill"><span id="hIcon">🍡</span> <span id="hCoin">0</span></span><span class="pill">🔮 <span id="hOrb">0</span>/3</span><span class="pill">⏱ <span id="hTime">0</span></span></div><button id="pauseBtn">❚❚</button></div>
<div id="help">←→ いどう ／ スペース ジャンプ ／ ↓ ためる ／ かべへおす のぼる ／ X のびーる</div>
<div id="banner"></div>
<div id="rotateHint">📱 よこむきに すると あそびやすいよ</div>
<div id="touch">
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div><div id="stickHint">ここを ゆびで<br>なぞって いどう</div></div>
  <div class="tb" data-k="act" id="actBtn" style="right:132px;bottom:34px">のびる</div>

</div>

<div class="screen show menu" id="title">
  <div class="blobs"></div>
  <div class="tTop"><h1 class="logo" id="logo">もちもち ぺたぺた だいぼうけん</h1><p>だれと いっしょに いく？</p></div>
  <div class="trio" id="chars"></div>
  <div class="tBot"><button class="btn big" id="toStages">あそぶ ▶</button></div>
</div>
<div class="screen menu" id="stagesScr">

  <div class="sHead"><button class="backBtn" id="backTitle">◀ キャラ</button><h1 class="logo">ステージを えらぼう</h1><div class="who"><img id="whoImg" alt=""></div></div>
  <div class="map" id="stages"></div>
</div>
<div class="screen" id="clearScr">
  <h1>クリア！</h1>
  <div class="res" id="resBox"></div>
  <div class="row"><button class="btn sec" id="cRetry">もういちど</button><button class="btn sec" id="cList">ステージいちらん</button><button class="btn" id="cNext">つぎへ ▶</button></div>
</div>
<div class="screen" id="pauseScr">

</div>

function buildLevel(src){
  const L={solids:[],spikes:[],anchors:[],plugs:[],coins:[],orbs:[],cps:[],signs:[],goal:null,minY:0};
  let x=-6, y=0, flip=0;
  const solid=(l,b,w,h,o={})=>{const s={l,b,w,h,...o};L.solids.push(s);return s;};
  const ground=n=>{solid(x,y-30,n,30,{ground:true}); x+=n; L.minY=Math.min(L.minY,y);};
  const row=(x0,x1,yy)=>{for(let cx=x0+1.5;cx<x1-1;cx+=2.2)L.coins.push({x:cx,y:yy});};
  const arc=(x0,x1,yy,h)=>{const n=Math.max(2,Math.round((x1-x0)/1.4));for(let i=0;i<=n;i++){const t=i/n;L.coins.push({x:x0+(x1-x0)*t,y:yy+Math.sin(t*Math.PI)*h});}};
  for(const tok of src.trim().split(/\s+/)){
    if(tok.startsWith('t:')){L.signs.push({x:x+1,y,text:tok.slice(2).replace(/_/g,'\n')});continue;}
    const c=tok[0], n=parseFloat(tok.slice(1))||0;
    switch(c){
      case 'g':{const gx=x;ground(n);if(n>=6&&(flip^=1))row(gx,x,y+1);break;}
      case 'p':arc(x-0.4,x+n+0.4,y+1.2,2);x+=n;break;
      case 'u':y+=n;break;
      case 'd':y-=n;break;
      case 's':{ground(n);L.spikes.push({l:x-n/2-1,w:2,b:y});arc(x-n/2-1.8,x-n/2+1.8,y+1.4,2.2);break;}
      case 'c':solid(x,y-30,1.6,30+n,{stick:true});for(let i=1;i<n;i+=1.5)L.coins.push({x:x-0.7,y:y+i});y+=n;x+=1.6;break;
      case 'h':solid(x-1.5,y+3.1,n+3,1,{stick:true});row(x-1,x+n+1,y+2.5);x+=n;break;
      case 'a':{const k=Math.max(1,Math.round(n/6));for(let i=0;i<k;i++)L.anchors.push({x:x+n*(i+1)/(k+1),y:y+5.5});arc(x,x+n,y+1.5,3);x+=n;break;}
      case 'j':ground(3);solid(x-2.4,y,1.8,0.45,{bounce:true});for(let i=1;i<n;i+=1.3)L.coins.push({x:x-1.5,y:y+1+i});y+=n;break;
      case 'm':{const cx=x+n/2, amp=Math.max(0.6,n/2-2.4);solid(cx-1.8,y-0.5,3.6,0.5,{mover:{bx:cx-1.8,by:y-0.5,ax:amp,ay:0,sp:0.8,ph:Math.random()*6}});L.coins.push({x:cx,y:y+1});x+=n;break;}
      case 'v':solid(x+0.5,y-0.5+n/2,3,0.5,{mover:{bx:x+0.5,by:y-0.5+n/2,ax:0,ay:n/2,sp:1,ph:-1.57}});x+=4;y+=n;L.coins.push({x:x-2,y:y+1.5});break;
      case 'f':for(let i=0;i<n;i++){x+=1.8;const yy=y+(i%2?0.8:0);solid(x,yy-0.6,3,0.6,{float:true});L.coins.push({x:x+1.5,y:yy+1});x+=3;}x+=1.8;break;
      case 'x':{ground(10);const gt=solid(x-4.5,y,1.4,9,{gate:true});L.plugs.push({x:x-5.4,y:y+1.7,gate:gt,popped:false});break;}
      case 'k':L.cps.push({x:x-2,y,on:false});break;
      case '*':L.orbs.push({x:x-3,y:y+3.3});break;
      case 'G':ground(16);L.goal={x:x-8,y};break;
    }
  }
  L.killY=L.minY-12; L.endX=x;
  return L;
}

function sfx(type,mul=1){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return;}
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
  const P={jump:[320,620,.15,'sine',.18],super:[200,900,.3,'sine',.2],coin:[1100,1600,.08,'triangle',.12],orb:[500,1500,.5,'triangle',.18],
    stick:[260,160,.08,'square',.06],bounce:[180,700,.25,'sine',.22],rope:[600,300,.12,'sawtooth',.05],hurt:[400,90,.35,'square',.1],
    cp:[700,1050,.2,'triangle',.15],clear:[523,1046,.6,'triangle',.18],land:[160,90,.06,'sine',.12],pop:[260,1300,.14,'sine',.28],stretch:[180,120,.1,'triangle',.05],miss:[700,250,.18,'sine',.1]}[type];
  if(!P) return;
  if(type==='stick'||type==='bounce'||type==='land'||type==='hurt')try{navigator.vibrate&&navigator.vibrate(type==='hurt'?60:14);}catch(e){}
  o.type=P[3]; o.frequency.setValueAtTime(P[0]*mul,t); o.frequency.exponentialRampToValueAtTime(P[1]*mul,t+P[2]);
  g.gain.setValueAtTime(P[4],t); g.gain.exponentialRampToValueAtTime(0.001,t+P[2]+0.05); o.start(t); o.stop(t+P[2]+0.08);
}

function pillowGeo(w,h,d,r){
  let g=new THREE.BoxGeometry(w,h,d,Math.max(3,Math.ceil(w*3)),2,8);const p=g.attributes.position;
  for(let k=0;k<p.count;k++){const x=p.getX(k),y=p.getY(k),z=p.getZ(k);
    const ex=Math.max(0,Math.abs(x)-(w/2-r))/r, ez=Math.max(0,Math.abs(z)-(d/2-r))/r, e=Math.min(1,Math.hypot(ex,ez));
    p.setY(k,y*Math.sqrt(1-e*e*0.85)+(y>0?0.05*(1-e):0));}
  g.deleteAttribute('normal');g.deleteAttribute('uv');g=mergeVertices(g);g.computeVertexNormals();return g;
}

function wobMat(color,s,extra={}){
  const m=mat(color,{roughness:.42,...extra});
  const u={uDentX:{value:0},uDent:{value:0},uWob:{value:0},uWX:{value:0},uTime:{value:0}}; s.u=u;
  m.onBeforeCompile=sh=>{Object.assign(sh.uniforms,u);
    sh.vertexShader='uniform float uDentX;uniform float uDent;uniform float uWob;uniform float uWX;uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
      float topw=smoothstep(-0.1,0.2,position.y);
      float dx=position.x-uDentX; float wx=position.x-uWX;
      float dent=-uDent*exp(-dx*dx*0.7);
      float rip=uWob*sin(abs(wx)*2.4-uTime*16.0)*exp(-abs(wx)*0.3)*0.22;
      float idle=sin(uTime*2.2+position.x*0.8+position.z*0.7)*0.03;
      transformed.y+=topw*(dent+rip+idle);`);};
  m.customProgramCacheKey=()=>'wob'; return m;
}

  const arch=mesh(new THREE.TorusGeometry(1.6,0.32,14,32,Math.PI),gm);arch.position.y=4;g.add(arch);

  // ふわふわ ただよう つぶ

  P={x:-3,y:0.01,vx:0,vy:0,w:0.8,h:1.1,face:1,ground:null,wall:0,ceil:false,rope:null,reach:null,charge:0,coyote:0,buf:0,jumps:1,lock:0,
     sy:1,svy:0,dead:0,rx:-3,ry:0,coins:0,orbs:0,time:0,falls:0,hist:[],touchStick:0,wasGround:true,combo:0,lastCoin:-9};

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- physics ----------
const G=32, SPEED=7.2, JUMP=13.2;
const ov=(ax,ay,aw,ah,s)=>ax<s.l+s.w&&ax+aw>s.l&&ay<s.b+s.h&&ay+ah>s.b;
function hitSolid(x,y,w,h,pred){for(const s of L.solids)if(ov(x,y,w,h,s)&&(!pred||pred(s)))return s;return null;}
const ropeRange=()=>charId==='nagai'?10.5:8;

function puff(x,y,n=6,col=0xffffff){for(let i=0;i<n;i++){const m=new THREE.Mesh(SPH,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.8}));
  m.scale.setScalar(0.15+Math.random()*.15);m.position.set(x,y,(Math.random()-.5));world.add(m);
  world.puffs.push({m,vx:(Math.random()-.5)*4,vy:Math.random()*3,t:0.5});}}

function popFx(x,y,col){puff(x,y,5,col);const r=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.05,6,24),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.9}));r.position.set(x,y,0.3);world.add(r);world.puffs.push({m:r,vx:0,vy:0,t:0.4,grow:6});}
function reachTip(){const r=P.reach,k=Math.sin(Math.min(1,r.t/0.4)*Math.PI),sx=P.x,sy=P.y+0.55;return[sx+(r.tx-sx)*k,sy+(r.ty-sy)*k];}
function die(){if(P.dead)return;P.dead=0.7;P.falls++;sfx('hurt');puff(P.x,P.y+0.5,12,0xff8fb0);model.root.visible=false;P.rope=null;}
function respawn(){P.x=P.rx;P.y=P.ry+0.05;P.vx=P.vy=0;P.wall=0;P.ceil=false;P.dead=0;model.root.visible=true;P.sy=0.4;P.svy=8;}

function step(dt){
  P.time+=dt;
  // movers
  for(const s of L.solids)if(s.mover){const M=s.mover;M.ph+=dt*M.sp;const nl=M.bx+Math.sin(M.ph)*M.ax, nb=M.by+Math.sin(M.ph)*M.ay;
    s.dx=nl-s.l;s.dy=nb-s.b;s.l=nl;s.b=nb;s.m.position.set(s.l+s.w/2,s.b+s.h/2,0);}
  if(P.dead){P.dead-=dt;if(P.dead<=0)respawn();return;}
  if(P.ground&&P.ground.mover){P.x+=P.ground.dx;P.y+=P.ground.dy;}
  const ax=(keys.right?1:0)-(keys.left?1:0);
  if(pressed.jump)P.buf=0.12; else P.buf-=dt;
  P.lock-=dt;

  // のびーる: 玉/せん → つかむ、 ピンクのかべ → くっついて ぶらさがる、 なにもない → てを のばして アイテムを とる
  if(pressed.act&&!P.rope){
    const R=ropeRange(), cy0=P.y+0.55; let best=null,bd=R,kind='';
    for(const p of L.plugs)if(!p.popped){const d=Math.hypot(p.x-P.x,p.y-cy0);if(d<Math.min(bd,6)){bd=d;best=p;kind='plug';}}
    if(!best){let bs=1e9;for(const a of L.anchors){const d=Math.hypot(a.x-P.x,a.y-cy0);if(d>=R||(a===P.lastA&&P.time-P.lastAT<0.6))continue;const sc=d-((a.x-P.x)*P.face>0?3:0);if(sc<bs){bs=sc;bd=d;best=a;kind='anchor';}}}
    let miss=null;
    if(!best){for(const [dx,dy] of [[P.face*0.55,0.83],[0,1],[P.face,0.2]]){const n=Math.hypot(dx,dy);
        for(let r=0.6;r<R;r+=0.2){const x=P.x+dx/n*r,y=cy0+dy/n*r,s=L.solids.find(s=>x>=s.l&&x<=s.l+s.w&&y>=s.b&&y<=s.b+s.h);
          if(s){if(s.stick&&!best){best={x,y,temp:true};bd=r;kind='anchor';}else if(!miss)miss={x,y};break;}}
        if(best)break;}}
    if(kind==='anchor'){P.rope={a:best,len:Math.max(2.2,bd*0.85)};P.wall=0;P.ceil=false;P.ground=null;sfx('rope');P.vx+=P.face*4;if(best.temp)puff(best.x,best.y,5,0xff9fbe);}
    else if(kind==='plug'){P.rope={a:best,len:Math.max(1.0,bd),plug:best};sfx('rope');}
    else {const tx=miss?miss.x:P.x+P.face*0.55*R*0.8,ty=miss?miss.y:cy0+0.83*R*0.8;P.reach={tx,ty,t:0};sfx('miss');}
  }
  if(P.reach){P.reach.t+=dt;if(P.reach.t>0.4)P.reach=null;}
  if(P.rope&&P.rope.plug&&!keys.act){P.rope=null;sfx('miss');}

  if(P.rope&&!P.rope.plug){
    P.vx+=ax*(ax*P.vx>=0?20:5)*dt; P.vy-=G*dt; P.rope.len=Math.max(keys.up?2.2:Math.min(P.rope.len,3.2),Math.min(ropeRange(),P.rope.len+(keys.down?4:keys.up?-6:-2.4)*dt));
    if(!keys.act){P.lastA=P.rope.a;P.lastAT=P.time;P.rope=null;P.vy+=3;P.vx=P.vx*1.15+ax*3;P.jumps=1;sfx('jump');}
    {const sp=Math.hypot(P.vx,P.vy);if(sp>13){P.vx*=13/sp;P.vy*=13/sp;}}
  } else if(P.wall){
    const climb=keys.up||ax===P.wall; P.vx=0; P.vy=climb?5:keys.down?-6:-0.4; P.jumps=1;
    if(P.buf>0){P.buf=0;P.vx=-P.wall*8.5;P.vy=13;P.face=-P.wall;P.lock=0.2;P.wall=0;sfx('jump');P.svy=6;}
    else if(ax===-P.wall&&!keys.up){P.wall=0;P.vx=ax*3;}
    if(P.wall)P.face=P.wall;
  } else if(P.ceil){
    P.vy=0; P.vx=ax*4.8; if(ax)P.face=ax; P.jumps=1;
    if(P.buf>0||pressed.down){P.ceil=false;P.vy=-2;P.buf=0;}
  } else {
    if(P.lock<=0){const tgt=ax*SPEED*(P.charge>0.05?0.15:1), acc=P.ground?45:30;P.vx+=Math.max(-acc*dt,Math.min(acc*dt,tgt-P.vx));}
    if(ax)P.face=ax;
    P.vy-=G*dt;
    if(charId==='mochi'&&keys.jump&&P.vy<0&&!P.ground)P.vy=Math.max(P.vy,-3.2);
    if(!keys.jump&&P.vy>0&&!P.superJ)P.vy-=G*1.3*dt;
    if(P.vy<-24)P.vy=-24;
    if(P.ground){P.coyote=0.1; P.jumps=charId==='usagi'?1:0;} else P.coyote-=dt;
    if(P.ground&&keys.down){P.charge=Math.min(1,P.charge+dt*1.6);} else if(!keys.jump) P.charge=Math.max(0,P.charge-dt*3);
    if(P.buf>0&&P.coyote>0){const c=P.charge;P.vy=JUMP+(c>0.2?8*Math.min(1,c/0.8):0);P.superJ=c>0.2;P.charge=0;P.buf=0;P.coyote=0;P.ground=null;sfx(P.superJ?'super':'jump');P.svy=P.superJ?14:7;if(P.superJ)puff(P.x,P.y,8);}
    else if(P.buf>0&&P.jumps>0&&!P.ground){P.vy=JUMP*0.9;P.jumps--;P.buf=0;sfx('jump');P.svy=7;puff(P.x,P.y,5,0xd8f07a);}
    if(P.vy<=0)P.superJ=false;
    if(P.touchStick&&(keys.up||ax===P.touchStick)&&!P.ground){P.wall=P.touchStick;sfx('stick');}
    else if(P.touchStick&&(keys.up||ax===P.touchStick)&&P.ground){P.wall=P.touchStick;P.ground=null;P.vy=5;P.y+=0.05;sfx("stick");}
  }

  // integrate X
  P.x+=P.vx*dt; P.touchStick=0;
  for(const s of L.solids){if(ov(P.x-P.w/2,P.y,P.w,P.h,s)){
    if(P.x<s.l+s.w/2){P.x=s.l-P.w/2-0.001;if(s.stick)P.touchStick=1;}else{P.x=s.l+s.w+P.w/2+0.001;if(s.stick)P.touchStick=-1;}
    if(s.stick&&!P.rope&&!P.wall&&!P.ground&&!P.ceil){P.wall=P.touchStick;sfx('stick');P.svy=-5;}
    if(!P.rope)P.vx=0; else P.vx*=-0.3;}}
  // integrate Y
  const wasG=!!P.ground; P.y+=P.vy*dt; P.ground=null; const impact=P.vy;
  for(const s of L.solids){if(ov(P.x-P.w/2,P.y,P.w,P.h,s)){
    if(P.vy<=0&&P.y-P.vy*dt>=s.b+s.h-0.35){P.y=s.b+s.h;
      if(s.bounce){P.vy=21;P.superJ=true;sfx('bounce');P.svy=-12;s.wob=1;puff(P.x,P.y,6,0xc8a0ff);}
      else{P.vy=0;P.ground=s;if(!wasG&&impact<-4){P.svy=impact*0.45;s.wob=Math.min(1,-impact/18);s.wx=P.x;if(impact<-12)sfx('land');}}}
    else if(P.vy>0){P.y=s.b-P.h;P.vy=0;if(s.stick&&!P.rope){P.ceil=true;sfx('stick');P.svy=5;}}
    else if(!s.mover){P.y=s.b+s.h;P.vy=0;P.ground=s;}}}
  if(P.ground){P.wall=0;P.ceil=false;}
  // stay stuck checks
  if(P.wall){const s=hitSolid(P.x-P.w/2+P.wall*0.05,P.y,P.w,P.h,s=>s.stick);if(!s){if((keys.up||(keys.right?1:0)-(keys.left?1:0)===P.wall)&&P.vy>0){P.vy=8;P.vx=P.wall*3;P.lock=0.25;}P.wall=0;}}
  if(P.ceil&&!hitSolid(P.x-P.w/2,P.y+0.05,P.w,P.h,s=>s.stick))P.ceil=false;
  // rope constraint
  if(P.rope&&P.rope.plug){const pl=P.rope.plug,cx=P.x,cy=P.y+0.55,dx=cx-pl.x,dy=cy-pl.y,d=Math.hypot(dx,dy),st=d-P.rope.len;
    P.rope.st=Math.max(0,st);
    if(st>0){P.vx-=dx/d*st*26*dt;P.vy-=Math.max(0,dy/d*st*10*dt);if(Math.random()<dt*st*6)sfx('stretch',1+st*0.3);}
    if(st>2.3){pl.popped=true;const gt=pl.gate;L.solids=L.solids.filter(s=>s!==gt);gt.dying=1;
      P.rope=null;P.vx=Math.sign(dx)*7;P.vy=7;P.ground=null;P.svy=12;sfx('pop');sfx('orb');puff(pl.x,pl.y,16,L.W.plug);pl.fly={vx:Math.sign(dx)*9,vy:9};banner('すぽーん！',0.9);}}
  if(P.rope&&!P.rope.plug){const a=P.rope.a,cx=P.x,cy=P.y+0.55,dx=cx-a.x,dy=cy-a.y,d=Math.hypot(dx,dy);
    if(d>P.rope.len){const nx=dx/d,ny=dy/d;P.x=a.x+nx*P.rope.len;P.y=a.y+ny*P.rope.len-0.55;const rv=P.vx*nx+P.vy*ny;if(rv>0){P.vx-=rv*nx;P.vy-=rv*ny;}}}

  // hazards / pickups
  if(P.y<L.killY||P.y<P.ry-9)die();
  for(const sp of L.spikes)if(ov(P.x-P.w/2+0.1,P.y,P.w-0.2,P.h,{l:sp.l+0.15,b:sp.b,w:sp.w-0.3,h:0.45}))die();
  const cx=P.x, cy=P.y+0.55;
  const rt=P.reach?reachTip():null;
  for(const c of L.coins)if(!c.got){const d=Math.hypot(c.x-cx,c.y-cy);
    if(rt&&Math.hypot(c.x-rt[0],c.y-rt[1])<0.9)c.fly=true;
    if(d<2.0)c.fly=true;
    if(c.fly){const k=Math.min(1,dt*(9+ (c.ft=(c.ft||0)+dt)*30));c.x+=(cx-c.x)*k;c.y+=(cy-c.y)*k;}
    if(d<0.7){c.got=true;c.m.visible=false;P.coins++;P.combo=P.time-P.lastCoin<0.9?P.combo+1:0;P.lastCoin=P.time;
      sfx('coin',Math.pow(2,[0,2,4,7,9,12,14,16,19,21][Math.min(9,P.combo)]/12));popFx(c.x,c.y,PASTEL[P.coins%6]);updHud();}}
  for(const o of L.orbs)if(!o.got&&Math.hypot(o.x-cx,o.y-cy)<1.1){o.got=true;o.m.visible=false;P.orbs++;sfx('orb');puff(o.x,o.y,14,0xd8b0ff);updHud();banner('いぬい玉 ゲット！',1.2);}
  for(const c of L.cps)if(!c.on&&P.x>c.x-0.5&&P.ground){c.on=true;P.rx=c.x;P.ry=c.y;c.flag.material=mat(0xff8fb0);sfx('cp');puff(c.x+0.5,c.y+2,8,0xff8fb0);}
  if(Math.abs(P.x-L.goal.x)<1.4&&P.y<L.goal.y+5)clear();
  // あんしんリスポーン: さいごに しっかり たっていた ばしょ
  const gs=P.ground;
  if(gs&&!gs.mover&&!gs.bounce&&P.x-0.9>gs.l&&P.x+0.9<gs.l+gs.w&&!L.spikes.some(sp=>Math.abs(sp.l+1-P.x)<2.6)){P.rx=P.x;P.ry=P.y;}
  // もちが のびて ちぎれる
  if(P.pw&&!P.wall&&!P.ground)P.strand={x:P.x+P.pw*0.45,y:P.y+0.55,t:0};
  if(P.pc&&!P.ceil)P.strand={x:P.x,y:P.y+P.h+0.1,t:0};
  P.pw=P.wall;P.pc=P.ceil;
  for(const k in pressed)delete pressed[k];
}

// ---------- visuals ----------
let camX=0,camY=0;
function visuals(dt,t){
  // squash spring (もちもち)
  let target=1;
  if(P.charge>0.02)target=1-0.45*P.charge;
  else if(P.wall)target=0.92; else if(P.ceil)target=1.15;
  else if(!P.ground&&!P.rope)target=1+Math.max(-0.15,Math.min(0.25,P.vy*0.018));
  else if(P.rope)target=1.2;
  P.svy+=((target-P.sy)*260-P.svy*13)*dt; P.sy+=P.svy*dt; P.sy=Math.max(0.45,Math.min(1.6,P.sy));
  const sx=1/Math.sqrt(P.sy);
  const r=model.root; r.position.set(P.x,P.y,0);
  if(P.ceil){r.position.y=P.y+P.h-0.05;r.scale.set(sx,-P.sy*0.95,sx);} else r.scale.set(sx*(P.wall?0.9:1),P.sy,sx);
  r.rotation.y+=((P.face>0?0.45:-0.45)-r.rotation.y)*Math.min(1,dt*10);
  r.rotation.z=P.wall?P.wall*0.12:P.rope?-P.vx*0.03:(P.ground?Math.sin(t*12)*0.04*Math.abs(P.vx)/SPEED:-P.vx*0.012);
  if(P.wall)r.position.x+=P.wall*0.12;
  const run=P.ground?Math.min(1,Math.abs(P.vx)/SPEED):0;
  model.body.position.y=run*(0.5+0.5*Math.sin(t*13))*0.07;
  model.body.scale.set(1+run*0.04*Math.sin(t*13+1.6),1-run*0.05*Math.sin(t*13+1.6),1);
  // あたまと かみの ゆれ(ばね)
  const pt=model.parts; P.hz=P.hz||0;P.hzv=P.hzv||0;
  const hzT=-P.vx*0.025+(P.ground?0:-P.vy*0.004); P.hzv+=((hzT-P.hz)*120-P.hzv*9)*dt; P.hz+=P.hzv*dt;
  if(pt.head){pt.head.rotation.z=P.hz*(P.ceil?-1:1);pt.head.position.y=0.86+(P.sy-1)*-0.06;}
  if(pt.tailL){const w=-P.vy*0.02+P.hz*2;pt.tailL.rotation.z=-w+Math.sin(t*3)*0.04;pt.tailR.rotation.z=w-Math.sin(t*3)*0.04;}
  if(pt.armL){pt.armL.rotation.z=-0.75+(P.ground?Math.sin(t*13)*0.3*run:-0.5);pt.armR.rotation.z=1.15+(P.ground?-Math.sin(t*13)*0.2*run:0.3);}
  // ちぎれる もち
  const sd=world.strand; if(P.strand){const S=P.strand;S.t+=dt;const px=P.x,py=P.y+0.55,d=Math.hypot(S.x-px,S.y-py);
    if(d>2.4||S.t>0.45||P.dead){puff(S.x+(px-S.x)*0.5,S.y+(py-S.y)*0.5,4,0xff9fbe);P.strand=null;sd.visible=false;}
    else{sd.visible=true;const th=Math.max(0.03,0.16-d*0.06);sd.position.set((S.x+px)/2,(S.y+py)/2,0.1);sd.scale.set(th,d,th);sd.rotation.z=Math.atan2(S.y-py,S.x-px)-Math.PI/2;}} else sd.visible=false;
  // あしばの ぷるぷる
  for(const s of L.solids)if(s.u){const u=s.u,on=P.ground===s,cxl=s.l+s.w/2;
    if(on&&Math.abs(P.vx)>1)s.wob=Math.max(s.wob||0,0.18);
    s.wob=(s.wob||0)*Math.pow(0.06,dt);u.uWob.value=s.wob*(L.W.jiggle?1.6:1.1);u.uTime.value=t;if(s.wx!==undefined)u.uWX.value=s.wx-cxl;
    const dT=on?0.16+P.charge*0.3:0;u.uDent.value+=(dT-u.uDent.value)*Math.min(1,dt*10);if(on)u.uDentX.value=P.x-cxl;
    if(s.mover||s.float){const w=Math.sin(t*20)*s.wob;s.m.scale.set(1+w*0.06,1-w*0.18,1);}}
  for(const s of L.all||[])if(s.dying>0){s.dying-=dt*1.3;const k=Math.max(0,s.dying);s.m.scale.set(1+Math.sin(t*30)*0.1*k,k,1);s.m.position.y=s.b+s.h*k/2;if(k<=0)s.m.visible=false;}
  for(const p of L.plugs){if(p.fly){p.fly.vy-=30*dt;p.m.position.x+=p.fly.vx*dt;p.m.position.y+=p.fly.vy*dt;p.m.rotation.z+=dt*12;if(p.m.position.y<L.killY)p.fly=null;}
    else if(!p.popped){const st=P.rope&&P.rope.plug===p?P.rope.st||0:0;p.m.scale.set(1+st*0.35,1-st*0.12,1-st*0.12);p.m.position.x=p.x-st*0.35;
      const near=Math.hypot(p.x-P.x,p.y-P.y-0.55)<6;p.ring.material.opacity=near?0.8:0.2;p.ring.rotation.y=Math.PI/2;p.ring.scale.setScalar(near?1.1+Math.sin(t*8)*0.12:1);
      p.gate.m.scale.x=1+Math.sin(t*25)*st*0.03;}}
  for(const d of L.bobs){d.position.y=d.userData.by+Math.sin(t*1.2+d.userData.ph)*0.4;const k=1+Math.sin(t*2.4+d.userData.ph)*0.04;d.scale.set(1/k,k,1/k);}
  {const a=L.parts.geometry.attributes.position,w=L.W.part;for(let k=0;k<a.count;k++){let x=a.getX(k)+(w[1]+Math.sin(t+k)*0.3)*dt,y=a.getY(k)+w[2]*dt;
    if(x<camX-30)x+=60;if(x>camX+30)x-=60;if(y<camY-18)y+=36;if(y>camY+18)y-=36;a.setXYZ(k,x,y,a.getZ(k));}a.needsUpdate=true;}
  // follower
  P.hist.push([P.x,P.y,P.face,P.ceil]); if(P.hist.length>18)P.hist.shift();
  const f=model.parts.follower; if(f){const h=P.hist[0];f.visible=model.root.visible;f.position.set(h[0]-h[2]*0.7,h[1]+(h[3]?0.3:0),-0.5);f.rotation.y=h[2]*0.45;f.scale.set(sx,P.sy,sx);}
  // rope
  const rp=world.rope,hd=world.hand;let tip=null;
  if(P.rope)tip=[P.rope.a.x,P.rope.a.y]; else if(P.reach)tip=reachTip();
  if(tip){const px=P.x,py=P.y+0.55,d=Math.max(0.01,Math.hypot(tip[0]-px,tip[1]-py)),th=Math.max(0.05,0.2-d*0.018)*(P.rope&&P.rope.plug?1-Math.min(0.6,(P.rope.st||0)*0.25):1);rp.visible=true;hd.visible=true;
    rp.position.set((tip[0]+px)/2,(tip[1]+py)/2,0.05);rp.scale.set(th,d,th);rp.rotation.z=Math.atan2(tip[1]-py,tip[0]-px)-Math.PI/2;hd.position.set(tip[0],tip[1],0.1);} else {rp.visible=false;hd.visible=false;}
  // anchors highlight
  const cy=P.y+0.55;
  {let any=false;for(const a of L.anchors)if(Math.hypot(a.x-P.x,a.y-cy)<ropeRange())any=true;for(const p of L.plugs)if(!p.popped&&Math.hypot(p.x-P.x,p.y-cy)<6)any=true;const ab=document.getElementById('actBtn');if(ab)ab.classList.toggle('ready',any&&!P.rope);}
  for(const a of L.anchors){const near=Math.hypot(a.x-P.x,a.y-cy)<ropeRange();a.ring.material.opacity=near?0.9:0.25;a.ring.scale.setScalar(near?1+Math.sin(t*8)*0.1:1);a.ring.rotation.x=Math.PI/2+Math.sin(t)*0.3;a.ring.rotation.y=t;}
  for(const c of L.coins)if(!c.got){const q=Math.sin(t*5+c.ph);c.m.rotation.y=Math.sin(t*1.5+c.ph)*0.8;c.m.position.set(c.x,c.y+(c.fly?0:Math.sin(t*3+c.ph)*0.1),0);c.m.scale.set(1+q*0.08,1-q*0.08,1);}
  for(const o of L.orbs)if(!o.got){o.m.position.y=o.y+Math.sin(t*2+o.x)*0.2;o.rg.rotation.z=t*2;const q=Math.sin(t*4+o.x)*0.06;o.m.scale.set(1+q,1-q,1);}
  for(const s of L.solids)if(s.bounce){s.wob=(s.wob||0)*Math.pow(0.02,dt);const w=Math.sin(t*30)*s.wob*0.4;s.m.scale.set(1-w*0.3,1+w,1-w*0.3);}
  L.goalM.children[3].position.y=5.9+Math.sin(t*2)*0.2;
  for(let i=world.puffs.length-1;i>=0;i--){const p=world.puffs[i];p.t-=dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.material.opacity=p.t*1.6;if(p.grow)p.m.scale.multiplyScalar(1+p.grow*dt);if(p.t<=0){world.remove(p.m);world.puffs.splice(i,1);}}
  // camera
  const tx=P.x+P.face*2.2, ty=P.y+2.6;
  camX+=(tx-camX)*Math.min(1,dt*3); camY+=(ty-camY)*Math.min(1,dt*(P.vy<-5?5:2.5));
  const zf=Math.pow(Math.min(2.2,Math.max(1,1.5/camera.aspect)),0.75)*(innerHeight<520?0.8:1);camera.position.set(camX,camY+1.2,12.5*zf); camera.lookAt(camX,camY-0.4,0);
  if(window.__closeup){const c=window.__closeup;camera.position.set(P.x+c[0],P.y+c[1],c[2]);camera.lookAt(P.x,P.y+0.8,0);}
  sun.position.set(camX-8,camY+18,14); sun.target.position.set(camX,camY-2,0);
  if(L.moon)L.moon.position.x=camX*0.8+30;
  document.getElementById('hTime').textContent=Math.floor(P.time);
}

// ---------- flow ----------
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id));
  const play=!id; document.body.classList.toggle('playing',play); document.getElementById('hud').classList.toggle('show',play);
  document.getElementById('touch').style.display=play&&isTouch?'block':'none';
  document.getElementById('help').style.display=play&&!isTouch?'block':'none';}
function start(i){i=Math.max(0,Math.min(STAGES.length-1,i|0));loadStage(i);state='play';show(null);for(const k in keys)keys[k]=0;}
function pause(){state='pause';show('pauseScr');}
function clear(){
  if(state!=='play')return; state='clear'; sfx('clear'); setTimeout(()=>sfx('orb'),250);
  const b=save.best[stageIdx]||{orbs:0,time:9999,coins:0};
  save.best[stageIdx]={orbs:Math.max(b.orbs,P.orbs),time:Math.min(b.time,Math.floor(P.time)),coins:Math.max(b.coins||0,P.coins)};
  save.unlocked=Math.max(save.unlocked,Math.min(STAGES.length,stageIdx+2)); store();
  const total=L.coins.length;
  document.getElementById('resBox').innerHTML=`<div class="big">${'🔮'.repeat(P.orbs)}${'⚪'.repeat(3-P.orbs)}</div>
    ${L.W.icon} ${L.W.itemName} ${P.coins} / ${total}<br>⏱ ${Math.floor(P.time)} びょう<br>${P.falls===0?'ノーミス！すごい！':'おっこちた かず '+P.falls}`;
  document.getElementById('cNext').style.display=stageIdx<STAGES.length-1?'':'none';
  if(stageIdx===STAGES.length-1)document.querySelector('#clearScr h1').textContent='ぜんぶ クリア！ おめでとう！';
  else document.querySelector('#clearScr h1').textContent='クリア！';
  setTimeout(()=>show('clearScr'),700);
}
function stageList(){
  const el=document.getElementById('stages'); el.innerHTML='';
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  document.getElementById('whoImg').src=`assets/p_${charId}.jpg`;
  STAGES.forEach((s,i)=>{const d=document.createElement('div'),lock=i>=save.unlocked,b=save.best[i],W=WORLDS[s.world];
    d.className='st'+(lock?' lock':'');d.style.cssText=`--a:${hex(W.cap)};--b:${hex(W.body)};--d:${-i*0.3}s`;
    d.innerHTML=`<div class="blob"><span class="em">${lock?'🔒':W.icon}</span><span class="num">${i+1}</span>${!lock&&!b?'<span class="next">NEW</span>':''}</div><div class="nm">${s.name}</div><div class="o">${b?'🔮'.repeat(b.orbs)+'⚪'.repeat(3-b.orbs):'⚪⚪⚪'}</div>`;
    if(!lock)d.onclick=()=>{sfx('bounce');start(i);}; el.appendChild(d);});
  state='menu'; show('stagesScr');
}
const chars=document.getElementById('chars');
const PANEL={mochi:{c:'#4e6fc4',fp:'45% 30%',r:'-1.5deg'},nagai:{c:'#7a4fd0',fp:'50% 35%',r:'1deg'},usagi:{c:'#93b81f',fp:'62% 25%',r:'-1deg'}};
CHARS.forEach(c=>{const d=document.createElement('div'),pn=PANEL[c.id];d.className='pc'+(c.id===charId?' sel':'');
  d.style.cssText=`--c:${pn.c};--fp:${pn.fp};--r:${pn.r}`;
  d.innerHTML=`<img src="assets/p_${c.id}.jpg" alt="${c.name}"><div class="ok">えらんだよ！</div><div class="tag"><b class="fl">${c.name}</b><b class="sh">${c.short}</b><span class="sk">${c.skill}</span><small>${c.desc}</small></div>`;
  d.onclick=()=>{if(charId===c.id){stageList();return;}charId=c.id;document.querySelectorAll('.pc').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');sfx('bounce');};
  chars.appendChild(d);});
// ロゴを 1もじずつ もちもち
{const lg=document.getElementById('logo');const tx='もちもち ぺたぺた だいぼうけん';lg.innerHTML=tx.split('').map((ch,k)=>ch===' '?' ':`<b class="${k>=5&&k<9?'pk':''}" style="animation-delay:${k*0.09}s">${ch}</b>`).join('');}
// ふわふわ うかぶ もち
document.querySelectorAll('.blobs').forEach(bl=>{const cols=['#ffd6e8','#d9ccff','#cfe8ff','#fff2c2','#d6f5d6'];
  for(let k=0;k<12;k++){const i=document.createElement('i');const sz=40+Math.random()*120;i.style.cssText=`width:${sz}px;height:${sz*0.85}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${cols[k%5]};animation-delay:${-Math.random()*7}s`;bl.appendChild(i);}});
document.getElementById('toStages').onclick=stageList;
document.getElementById('backTitle').onclick=()=>{state='title';show('title');};
document.getElementById('cRetry').onclick=()=>start(stageIdx);
document.getElementById('cList').onclick=stageList;
document.getElementById('cNext').onclick=()=>start(stageIdx+1);
document.getElementById('pResume').onclick=()=>{state='play';show(null);};
document.getElementById('pRetry').onclick=()=>start(stageIdx);
document.getElementById('pList').onclick=stageList;
document.getElementById('pauseBtn').onclick=pause;

// title backdrop
loadStage(0); document.getElementById('banner').style.opacity=0;

let last=performance.now(), acc=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000;
  if(state==='play'){acc+=dt;while(acc>=1/120){step(1/120);acc-=1/120;}}
  else {acc=0; for(const k in pressed)delete pressed[k]; if(state==='title'||state==='menu'){P.face=1;P.ground=L.solids[0];}}
  visuals(dt,t);
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
window.__game={get P(){return P},get L(){return L},start,keys,press,step,setState:s=>state=s,get state(){return state}};
</script>
